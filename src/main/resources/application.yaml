spring:
  application:
    name: GSMC-server-v4
  config:
    # 교과성적 과목 목록. 기본은 JAR에 포함된 파일이고, 운영에서 바꾸려면 외부 파일 경로(file:...)를 지정한다.
    import: ${ACADEMIC_CURRICULUM_PATH:classpath:academic-curriculum.yml}
  graphql:
    http:
      path: /graphql
    graphiql:
      # API 문서 UI(GraphiQL·Swagger)는 운영에 노출되지 않도록 기본은 끄고, 로컬 등 필요한 환경에서만 API_DOCS_ENABLED=true로 켠다.
      enabled: ${API_DOCS_ENABLED:false}
      path: /graphiql
    schema:
      printer:
        # GraphiQL과 같은 정책으로 병합된 SDL 조회 경로(/graphql/schema)를 제어한다.
        enabled: ${API_DOCS_ENABLED:false}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 기본값 10에 의존하지 않도록 명시한다. DB 조회 GraphQL을 섞어 동시 200명으로 측정했을 때 풀 10은 오류율 0.54%,
      # 30은 0.01%였고 50은 더 나아지지 않았다. 서버 수 x 풀 크기가 DB의 max_connections(기본 151)를 넘지 않게 맞춘다.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      connection-timeout: 1000
      validation-timeout: 1000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # OSIV가 활성화된 요청에서도 트랜잭션 종료 시 물리 커넥션을 반납한다.
        # 외부 I/O 대기가 요청 범위의 커넥션 점유로 전파되지 않도록 한다.
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
  task:
    scheduling:
      pool:
        # 스케줄러 스레드를 쓰는 작업: 알림 Heartbeat 디스패치, 스토리지 객체 삭제 워커, 점수 캐시 무효화 디바운스.
        # 한 작업이 지연돼도(예: 스토리지 장애 중 삭제 호출이 타임아웃까지 걸림) 나머지가 같은 스레드를 기다리지
        # 않도록 이 스케줄러를 쓰는 작업 수(3개)보다 넉넉하게 둔다. Heartbeat의 실제 소켓 전송은 sse.heartbeat-executor 풀에서 처리한다.
        size: 4
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 1s
      timeout: 1s
  flyway:
    enabled: true
    # 빈 스키마에서는 baseline-on-migrate가 동작하지 않으므로 V1부터 전부 적용된다.
    # 이미 수동으로 SQL이 반영된 스키마(flyway_schema_history 없음)에서는
    # baseline-version 다음 버전부터 실행되므로, 환경별 실제 반영 버전에 맞춰야 한다.
    baseline-on-migrate: true
    baseline-version: ${FLYWAY_BASELINE_VERSION:10}

graphql:
  dev-anonymous-access-enabled: ${GRAPHQL_DEV_ANONYMOUS_ACCESS_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}] [userId=%X{userId:-anonymous}]"

sse:
  heartbeat-interval: 30000
  emitter-timeout: 1800000
  max-connections-per-user: 5
  # SSE 소켓 전송 전용 스레드 풀. 유휴 스레드는 keep-alive 뒤 회수한다(Heartbeat 주기보다 길게 둔다).
  # Heartbeat: 연결 하나당 전송 작업 하나. pool-size개의 스레드가 모두 느린 전송에 묶이면 queue-capacity까지 대기하고,
  # 그마저 차면 이번 주기 전송을 건너뛴다.
  heartbeat-executor:
    pool-size: ${SSE_HEARTBEAT_EXECUTOR_POOL_SIZE:32}
    queue-capacity: ${SSE_HEARTBEAT_EXECUTOR_QUEUE_CAPACITY:2000}
    keep-alive: ${SSE_HEARTBEAT_EXECUTOR_KEEP_ALIVE:60s}
  # 알림: 큐에는 알림이 아니라 사용자별 대기열을 비우는 작업이 들어가므로, queue-capacity는 전송을 기다리는 사용자 수의
  # 상한이다. 그마저 차면 그 사용자의 대기 알림 실시간 전송을 건너뛴다(알림은 DB에 저장돼 있다).
  notify-executor:
    pool-size: ${SSE_NOTIFY_EXECUTOR_POOL_SIZE:16}
    queue-capacity: ${SSE_NOTIFY_EXECUTOR_QUEUE_CAPACITY:500}
    keep-alive: ${SSE_NOTIFY_EXECUTOR_KEEP_ALIVE:60s}
  # 사용자 1인당 전송을 기다릴 수 있는 최대 알림 수. 소켓이 막힌 사용자에게 계속 쌓이면 가장 오래된 대기 알림부터 버린다.
  max-pending-alerts-per-user: ${SSE_MAX_PENDING_ALERTS_PER_USER:100}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

sdk:
  logging:
    enabled: true
    not-logging-urls:
      - "/graphiql/**"
      - "/graphql/**"
      - "/api/alerts/stream"
  response:
    enabled: false
  swagger:
    enabled: false
  exception:
    enabled: false

security:
  oauth:
    client-id: ${OAUTH_CLIENT_ID}
    client-secret: ${OAUTH_CLIENT_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 3600
    refresh-token-expiry: 2592000

datagsm:
  openapi:
    base-url: ${DATAGSM_OPENAPI_BASE_URL:https://openapi.datagsm.kr}
    api-key: ${DATAGSM_OPENAPI_KEY}
    connect-timeout: ${DATAGSM_OPENAPI_CONNECT_TIMEOUT:3s}
    read-timeout: ${DATAGSM_OPENAPI_READ_TIMEOUT:5s}
    total-timeout: ${DATAGSM_OPENAPI_TOTAL_TIMEOUT:10s}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}

discord:
  webhook:
    graphql-latency-url: ${DISCORD_GRAPHQL_LATENCY_WEBHOOK_URL:}
  error-alert:
    enabled: ${DISCORD_ERROR_ALERT_ENABLED:false}
    webhook-url: ${DISCORD_ERROR_ALERT_WEBHOOK_URL:}
    environment: ${APP_ENVIRONMENT:local}
    connect-timeout: ${DISCORD_ERROR_ALERT_CONNECT_TIMEOUT:1s}
    read-timeout: ${DISCORD_ERROR_ALERT_READ_TIMEOUT:2s}
    suppression-window: ${DISCORD_ERROR_ALERT_SUPPRESSION_WINDOW:5m}
    cache-max-size: ${DISCORD_ERROR_ALERT_CACHE_MAX_SIZE:1000}
    queue-capacity: ${DISCORD_ERROR_ALERT_QUEUE_CAPACITY:100}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
