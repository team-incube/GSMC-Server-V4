spring:
  application:
    name: GSMC-server-v4
  config:
    # 교과성적 과목 목록. 기본은 JAR에 포함된 파일이고, 운영에서 바꾸려면 외부 파일 경로(file:...)를 지정한다.
    import: ${ACADEMIC_CURRICULUM_PATH:classpath:academic-curriculum.yml}
  graphql:
    graphiql:
      # API 문서 UI(GraphiQL·Swagger)는 운영에 노출되지 않도록 기본은 끄고, 로컬 등 필요한 환경에서만 API_DOCS_ENABLED=true로 켠다.
      enabled: ${API_DOCS_ENABLED:false}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 1000
      validation-timeout: 1000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # OSIV가 활성화된 요청에서도 트랜잭션 종료 시 물리 커넥션을 반납한다.
        # 외부 I/O 대기가 요청 범위의 커넥션 점유로 전파되지 않도록 한다.
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
  task:
    scheduling:
      pool:
        # 알림 Heartbeat와 스토리지 객체 삭제 워커가 같은 스레드를 기다리지 않도록 분리한다.
        # 스토리지 장애 중 삭제 호출이 타임아웃까지 걸리면 Heartbeat가 밀려 SSE 연결이 끊길 수 있다.
        size: 2
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 1s
      timeout: 1s
  flyway:
    enabled: true
    # 빈 스키마에서는 baseline-on-migrate가 동작하지 않으므로 V1부터 전부 적용된다.
    # 이미 수동으로 SQL이 반영된 스키마(flyway_schema_history 없음)에서는
    # baseline-version 다음 버전부터 실행되므로, 환경별 실제 반영 버전에 맞춰야 한다.
    baseline-on-migrate: true
    baseline-version: ${FLYWAY_BASELINE_VERSION:10}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}] [userId=%X{userId:-anonymous}]"

sse:
  heartbeat-interval: 30000
  emitter-timeout: 1800000
  max-connections-per-user: 5

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

sdk:
  logging:
    enabled: true
    not-logging-urls:
      - "/graphiql/**"
      - "/graphql/**"
      - "/api/alerts/stream"
  response:
    enabled: false
  swagger:
    enabled: false
  exception:
    enabled: false

security:
  oauth:
    client-id: ${OAUTH_CLIENT_ID}
    client-secret: ${OAUTH_CLIENT_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 3600
    refresh-token-expiry: 2592000

datagsm:
  openapi:
    base-url: ${DATAGSM_OPENAPI_BASE_URL:https://openapi.datagsm.kr}
    api-key: ${DATAGSM_OPENAPI_KEY}
    connect-timeout: ${DATAGSM_OPENAPI_CONNECT_TIMEOUT:3s}
    read-timeout: ${DATAGSM_OPENAPI_READ_TIMEOUT:5s}
    total-timeout: ${DATAGSM_OPENAPI_TOTAL_TIMEOUT:10s}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}

discord:
  webhook:
    graphql-latency-url: ${DISCORD_GRAPHQL_LATENCY_WEBHOOK_URL:}
  error-alert:
    enabled: ${DISCORD_ERROR_ALERT_ENABLED:false}
    webhook-url: ${DISCORD_ERROR_ALERT_WEBHOOK_URL:}
    environment: ${APP_ENVIRONMENT:local}
    connect-timeout: ${DISCORD_ERROR_ALERT_CONNECT_TIMEOUT:1s}
    read-timeout: ${DISCORD_ERROR_ALERT_READ_TIMEOUT:2s}
    suppression-window: ${DISCORD_ERROR_ALERT_SUPPRESSION_WINDOW:5m}
    cache-max-size: ${DISCORD_ERROR_ALERT_CACHE_MAX_SIZE:1000}
    queue-capacity: ${DISCORD_ERROR_ALERT_QUEUE_CAPACITY:100}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
