        - { name: 자바 프로그래밍, departments: [SOFTWARE, SMART_IOT, AI] }
        - { name: 운영체제, departments: [SOFTWARE, AI] }
        - { name: 사물 인터넷과 센서 제어, departments: [SMART_IOT] }
        - { name: 가전 기기 시스템 소프트웨어 개발, departments: [SMART_IOT] }
