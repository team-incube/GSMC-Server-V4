        - { name: 착용형 스마트기기 개발, departments: [SMART_IOT] }
        - { name: 인공지능 모델링, departments: [AI] }
        - { name: 인공지능 서비스 구현, departments: [AI] }
        - { name: 웹 프로그래밍 실무, departments: [SOFTWARE, SMART_IOT, AI], optional: true }
