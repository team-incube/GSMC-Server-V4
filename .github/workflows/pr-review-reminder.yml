name: PR Review Reminder

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: pr-review-reminder
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Remind stale PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_ID: ${{ secrets.DISCORD_BACKEND_ROLE_ID }}
        run: |
          gh label create "🔔 Reminded" --color FBCA04 2>/dev/null || true
          cutoff=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)

          gh pr list --state open --limit 100 --json number,title,url,author,isDraft,reviews,labels \
            | jq -c '.[]
                | select(.isDraft == false)
                | select((.reviews | length) == 0)
                | select([.labels[].name] | index("📣 Mentioned"))
                | select([.labels[].name] | index("🔔 Reminded") | not)' \
            | while read -r pr; do
                num=$(jq -r .number <<< "$pr")

                # 기준 시각: 📣 Mentioned 라벨이 붙은 시각 (CI 통과 멘션 시점)
                mentioned_at=$(gh api "repos/$GH_REPO/issues/$num/events" --paginate \
                  --jq '.[] | select(.event == "labeled" and .label.name == "📣 Mentioned") | .created_at' \
                  | tail -n 1)
                if [ -z "$mentioned_at" ] || [[ "$mentioned_at" > "$cutoff" ]]; then
                  continue
                fi

                # 라벨 먼저: 라벨 기록이 실패하면 전송하지 않음 (반복 멘션 방지)
                gh pr edit "$num" --add-label "🔔 Reminded"

                payload=$(jq -n --arg role "$ROLE_ID" --argjson pr "$pr" '{
                  content: "<@&\($role)> ⏰ 1시간째 리뷰 대기 중이에요!\n**#\($pr.number) \($pr.title)** by `\($pr.author.login)`\n\($pr.url)",
                  allowed_mentions: { roles: [$role] }
                }')
                if ! curl -sf -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"; then
                  gh pr edit "$num" --remove-label "🔔 Reminded" || true
                  echo "::warning::#$num 리마인드 전송 실패"
                fi
              done
